name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# NOTE (2026-11-24): This is the canonical, GitHub-supported Pages workflow.
# An earlier revision added a custom in-workflow retry that POSTed
# /pages/deployments directly (to dodge what looked like deploy-pages@v4
# flakiness). Evidence from the run history showed the opposite: that custom
# step failed 5/5 (an OIDC-envelope bug made every POST 400; job logs are
# unreadable without repo admin rights, so it couldn't be debugged), while
# actions/deploy-pages@v4 succeeded 5/5 as the fallback and the site always
# deployed correctly. The transient-failure resilience that matters is already
# built in: deploy-pages@v4 relies on GitHub's Pages service auto-rescheduling
# a failed deployment (deployment_attempt_error). Keeping a single, supported
# deploy step is more reliable than the home-grown retry, so it is the sole
# deploy path here.

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
