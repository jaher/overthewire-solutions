# Re-deploy GitHub Pages when the "Publish site to GitHub Pages" workflow fails.
#
# The publish workflow uploads the site artifact fine but actions/deploy-pages@v4
# transiently flakes (~50% of runs, observed 2026-11-23 21:34/21:36/22:06Z failing
# while 21:51Z succeeded on an otherwise-identical tree). The uploaded github-pages
# artifact is still valid, so on a failed run we re-deploy it from here after letting
# the Pages service settle. This is a SEPARATE workflow (fresh run => fresh
# github-pages environment), because a second job in the same workflow cannot
# re-declare the github-pages environment (it gets skipped).
name: Retry Pages deploy

on:
  workflow_run:
    workflows: ["Publish site to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  retry-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Let the Pages service settle (avoid the transient deploy flake)
        run: sleep 120

      - name: Pull the github-pages artifact from the failed run
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: site
          github-token: ${{ github.event.workflow_run.token }}
          github-run-id: ${{ github.event.workflow_run.id }}

      - name: Re-publish it as this run's github-pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Re-deploy to GitHub Pages
        uses: actions/deploy-pages@v4
